name: Deploy windows branch

on:
  push:
    branches:
      - windows
  workflow_dispatch:

jobs:
  validate:
    name: Validate build
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-only-jwt-secret
      ADMIN_PASSWORD: ci-only-admin-password
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frontend dependencies
        run: |
          npm install
          npm --prefix web install --include=optional
          npm --prefix web install --no-save @rolldown/binding-linux-x64-gnu

      - name: Build frontend
        run: npm run build

      - name: Compile backend
        run: python -m py_compile server/app/main.py

  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$DEPLOY_SSH_KEY_B64" | base64 -d > ~/.ssh/tts_lab_deploy_key
          chmod 600 ~/.ssh/tts_lab_deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Run remote deployment
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_ROOT: ${{ secrets.DEPLOY_ROOT }}
          DEPLOY_GIT_REMOTE_URL: ${{ secrets.DEPLOY_GIT_REMOTE_URL }}
          DEPLOY_SUDO_PASSWORD: ${{ secrets.DEPLOY_SUDO_PASSWORD }}
        run: |
          set -euo pipefail
          remote_root="${DEPLOY_ROOT:-/home/ricky/tts-lab}"
          scp -i ~/.ssh/tts_lab_deploy_key \
            -o IdentitiesOnly=yes \
            scripts/deploy_linux_nvidia.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/tts-lab-deploy.sh"
          ssh -i ~/.ssh/tts_lab_deploy_key \
            -o IdentitiesOnly=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' <<REMOTE
          export DEPLOY_BRANCH=windows
          export DEPLOY_ROOT=$(printf '%q' "$remote_root")
          export DEPLOY_GIT_REMOTE_URL=$(printf '%q' "${DEPLOY_GIT_REMOTE_URL:-}")
          export DEPLOY_SUDO_PASSWORD=$(printf '%q' "${DEPLOY_SUDO_PASSWORD:-}")
          bash /tmp/tts-lab-deploy.sh
          REMOTE
