name: Deploy windows branch

on:
  push:
    branches:
      - windows
  workflow_dispatch:

jobs:
  validate:
    name: Validate build
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-only-jwt-secret
      ADMIN_PASSWORD: ci-only-admin-password
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frontend dependencies
        run: |
          npm install
          npm --prefix web install --include=optional
          npm --prefix web install --no-save @rolldown/binding-linux-x64-gnu

      - name: Build frontend
        run: npm run build

      - name: Compile backend
        run: python -m py_compile server/app/main.py

  deploy:
    name: Deploy on VM
    runs-on: tts-lab-deploy
    needs: validate
    env:
      DEPLOY_BRANCH: windows
      DEPLOY_ROOT: ${{ secrets.DEPLOY_ROOT }}
      DEPLOY_GIT_REMOTE_URL: ${{ secrets.DEPLOY_GIT_REMOTE_URL }}
      DEPLOY_SUDO_PASSWORD: ${{ secrets.DEPLOY_SUDO_PASSWORD }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Run local VM deployment
        shell: bash
        run: |
          set -euo pipefail
          deploy_root="${DEPLOY_ROOT:-/home/ricky/tts-lab}"
          remote_url="${DEPLOY_GIT_REMOTE_URL:-}"
          git_source="${remote_url:-origin}"
          git_auth_config=()

          if [ -n "${GITHUB_TOKEN:-}" ]; then
            auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
            git_auth_config=(-c "http.https://gitea.clevics.co.kr/.extraheader=AUTHORIZATION: basic ${auth_header}")
            export DEPLOY_GIT_AUTH_HEADER="AUTHORIZATION: basic ${auth_header}"
            export DEPLOY_GIT_AUTH_BASE_URL="https://gitea.clevics.co.kr/"
          fi

          if [ ! -d "$deploy_root/.git" ]; then
            if [ -z "$remote_url" ]; then
              echo "DEPLOY_GIT_REMOTE_URL is required for first deploy because ${deploy_root} is not a git checkout." >&2
              exit 1
            fi
            mkdir -p "$(dirname "$deploy_root")"
            git "${git_auth_config[@]}" clone --branch "$DEPLOY_BRANCH" "$remote_url" "$deploy_root"
          fi

          cd "$deploy_root"
          git "${git_auth_config[@]}" fetch "$git_source" "$DEPLOY_BRANCH"
          current_branch="$(git rev-parse --abbrev-ref HEAD)"
          if [ "$current_branch" != "$DEPLOY_BRANCH" ]; then
            if git show-ref --verify --quiet "refs/heads/${DEPLOY_BRANCH}"; then
              git checkout "$DEPLOY_BRANCH"
            else
              git checkout -b "$DEPLOY_BRANCH"
            fi
          fi
          git merge --ff-only FETCH_HEAD

          chmod +x scripts/deploy_linux_nvidia.sh
          bash scripts/deploy_linux_nvidia.sh
